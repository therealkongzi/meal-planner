<style>
:root{--bg:#14171c;--card:#1e232b;--card2:#272d37;--line:#343b47;--text:#eef1f5;--dim:#9aa4b2;--acc:#f0a030;--ok:#3fb7a3;--bad:#e5534b;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 84px)}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);min-height:58px}
header h1{font-size:20px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:14px;max-width:640px;margin:0 auto}
button,.btn{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;min-height:46px;padding:0 16px;cursor:pointer}
button:active{opacity:.7}button:disabled{opacity:.4}
.pri{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.ghost{background:transparent;border-color:transparent;color:var(--dim)}
.sm{min-height:38px;padding:0 12px;font-size:15px;border-radius:10px}
.full{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.day{cursor:pointer;min-height:76px}
.day.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.dlabel{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.t2{font-size:19px;font-weight:600}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--acc);color:#111;margin-left:6px;vertical-align:middle;text-transform:none;letter-spacing:0}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--dim);margin:4px 4px 0 0}
.dim{color:var(--dim)}.small{font-size:14px}.tiny{font-size:12px}.center{text-align:center}
.okc{color:var(--ok);font-weight:600}.warn{color:#ffd08a}
input,textarea,select{font:inherit;font-size:17px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;min-height:46px;padding:8px 10px;width:100%}
select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
input::placeholder,textarea::placeholder{color:#6d7684}
input:focus,textarea:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow,.grow{flex:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:#0e1014;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;border-radius:0;background:transparent;min-height:60px;color:var(--dim);padding:0 2px;font-size:15px}
nav.tabs button.on{color:var(--acc);font-weight:600}
.list>button,.list>.card{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;min-height:64px}
.seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.seg button{flex:1;padding:0 8px;min-width:0}.seg button.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.chip{min-height:40px;padding:0 14px;font-size:15px;border-radius:99px}
.chip.on{background:var(--ok);border-color:var(--ok);color:#111;font-weight:600}
label.f{display:block;font-size:14px;color:var(--dim);margin:12px 0 4px}
h2{font-size:15px;margin:20px 0 8px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translateX(-50%);background:var(--ok);color:#111;padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:90vw;text-align:center}
.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.weeknav>button{width:52px;padding:0;font-size:24px}
.step{width:44px;padding:0;font-size:22px}
.sv{min-width:30px;text-align:center;font-size:18px}
.mac{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.mac div{background:var(--card2);border-radius:10px;padding:8px 4px;text-align:center}
.mac b{display:block;font-size:18px;color:var(--acc)}
.mac span{font-size:12px;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--dim);font-weight:500}td.n,th.n{text-align:right}
ul.ing{padding:0;margin:0;list-style:none}ul.ing li{padding:9px 0;border-bottom:1px solid var(--line)}ul.ing li b{display:inline-block;min-width:84px;color:var(--acc);font-weight:600}
ol.steps{padding-left:22px;margin:0}ol.steps li{margin-bottom:10px}
.ingrow{border-top:1px solid var(--line);padding:10px 0}
.ingrow .q{width:84px;flex:none}.ingrow select{width:118px;flex:none}
.acw{position:relative;margin-top:8px}
.ac{position:absolute;left:0;right:0;top:100%;z-index:8;background:var(--card2);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 8px 24px #000a}
.ac:empty{display:none}
.ac button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;min-height:46px;font-size:16px}
.ist{margin-top:6px;min-height:20px}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.item .txt{flex:1;min-width:0}
.item.done .txt{opacity:.5;text-decoration:line-through}
.chk{width:48px;height:48px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:22px;padding:0;color:transparent;flex:none}
.chk.on{background:var(--ok);border-color:var(--ok);color:#111}
.x{width:44px;padding:0;flex:none;color:var(--dim);background:transparent;border-color:transparent;font-size:20px}
.note{font-size:14px;color:#cfe9e4;background:#173430;border-radius:10px;padding:10px 12px;margin:8px 0}
.estl{font-size:12px;font-weight:700;color:#111;background:#ffd08a;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle;letter-spacing:0;text-transform:none}
textarea.copy{font-size:14px}
</style>
</head>

[4,'piece','Pork loin chop'],[900,'g','Potatoes','peeled and cubed'],[0.5,'cup','Milk, 2%'],[2,'tbsp','Butter'],[400,'g','Green beans / string beans (sitaw)'],[2,'clove','Garlic','minced'],[1,'tbsp','Vegetable oil'],[1,'tsp','Paprika'],[1,'tsp','Salt']],
steps:['Boil potatoes 15 minutes until tender; drain and mash with milk, butter and salt.','Season chops with paprika, salt and pepper. Sear in oil 4-5 minutes per side to 63°C / 145°F; rest 5 minutes.','Steam or sauté green beans with garlic 5 minutes.','Serve together.']},
{id:'b-chickenparm',name:'Baked chicken parmesan with pasta',time:45,serv:4,tags:['kid-favorite'],ing:[
[800,'g','Chicken breast, boneless skinless','halved into cutlets'],[0.75,'cup','Panko breadcrumbs'],[0.5,'cup','Parmesan, grated'],[1,'piece','Eggs'],[1.5,'cup','Marinara / pasta sauce'],[1,'cup','Mozzarella, part-skim','shredded'],[340,'g','Pasta, dry'],[1,'tbsp','Olive oil'],[1,'tsp','Italian seasoning']],
steps:['Heat oven to 220°C / 425°F.','Dip cutlets in beaten egg, then in panko mixed with half the parmesan and the Italian seasoning.','Place on an oiled sheet pan and bake 15 minutes.','Top each with marinara and mozzarella; bake 8 more minutes.','Meanwhile cook pasta and toss with the remaining sauce and parmesan.']},
{id:'b-stuffedpeppers',name:'Stuffed bell peppers',time:50,serv:4,tags:['budget'],ing:[
[500,'g','Ground beef 90/10'],[1.5,'cup','White rice, cooked'],[4,'piece','Red bell pepper','tops cut, seeded'],[1,'can','Diced tomatoes, canned'],[1,'cup','Mozzarella, part-skim','shredded'],[1,'piece','Onion','diced'],[2,'clove','Garlic','minced'],[1,'tsp','Italian seasoning']],
steps:['Heat oven to 190°C / 375°F.','Brown beef with onion and garlic. Stir in tomatoes, rice and seasoning.','Fill peppers and stand them in a baking dish with 1/4 cup water.','Cover with foil and bake 30 minutes. Top with cheese and bake 10 minutes uncovered.']},
{id:'b-eggrollbowl',name:'Egg roll in a bowl',time:20,serv:4,tags:['quick','budget'],ing:[
[700,'g','Ground pork'],[6,'cup','Coleslaw mix'],[1,'piece','Carrots','shredded'],[0.25,'cup','Soy sauce'],[4,'clove','Garlic','minced'],[1,'piece','Ginger, fresh','grated'],[1,'tbsp','Sesame oil'],[3,'stalk','Green onions','sliced'],[1,'tbsp','Sriracha','optional']],
steps:['Brown pork in a large skillet; drain excess fat.','Add garlic and ginger for 1 minute.','Add coleslaw mix, carrot and soy sauce; stir-fry 4-5 minutes until just wilted.','Finish with sesame oil, green onions and sriracha.']},
{id:'b-pizza',name:'Homemade pizza night',time:35,serv:4,tags:['kid-favorite'],ing:[
[2,'piece','Pizza dough'],[1,'cup','Marinara / pasta sauce'],[3,'cup','Mozzarella, part-skim','shredded'],[200,'g','Ham, sliced','chopped'],[1,'piece','Green bell pepper','sliced'],[1.5,'cup','Mushrooms, white','sliced'],[1,'cup','Pineapple chunks, canned','drained, optional'],[1,'tbsp','Olive oil']],
steps:['Heat oven as hot as it goes (250°C / 480°F) with a tray inside.','Stretch dough into 2 pizzas on parchment and brush the edges with oil.','Spread sauce, add cheese and toppings.','Slide onto the hot tray and bake 10-12 minutes until browned and bubbling.']},
{id:'b-tunapasta',name:'Tuna and pea pasta',time:20,serv:4,tags:['quick','budget'],ing:[
[400,'g','Pasta, dry'],[2,'can','Tuna, canned in water (drained)'],[1,'cup','Peas, frozen'],[3,'clove','Garlic','sliced'],[3,'tbsp','Olive oil'],[1,'piece','Lemons'],[0.33,'cup','Parmesan, grated'],[0.25,'tsp','Red pepper flakes']],
steps:['Cook pasta; add peas for the last 2 minutes. Save 1/2 cup pasta water, then drain.','Warm garlic and pepper flakes in olive oil 1 minute.','Add pasta, peas, tuna, lemon zest and juice, and a splash of pasta water; toss.','Top with parmesan.']},
{id:'b-steakbowls',name:'Steak and veggie rice bowls',time:30,serv:4,tags:['quick'],ing:[
[800,'g','Beef sirloin steak'],[1.5,'cup','Jasmine rice, uncooked'],[2,'piece','Zucchini','sliced'],[1,'piece','Red bell pepper','sliced'],[1.5,'cup','Mushrooms, white','sliced'],[3,'tbsp','Soy sauce'],[1,'tbsp','Honey'],[2,'clove','Garlic','minced'],[1,'tbsp','Vegetable oil'],[1,'tsp','Sesame seeds']],
steps:['Cook rice.','Season steak and sear 4 minutes per side in a hot pan; rest and slice.','Stir-fry vegetables in oil 4-5 minutes.','Mix soy sauce, honey and garlic; toss with the vegetables.','Serve rice topped with vegetables, steak and sesame seeds.']},
{id:'b-tilapia',name:'Pan-fried tilapia with garlic rice and salad',time:25,serv:4,tags:['quick','budget'],ing:[
[700,'g','Tilapia fillet'],[2,'tbsp','All-purpose flour'],[2,'tbsp','Vegetable oil'],[1.5,'cup','White rice, uncooked'],[6,'clove','Garlic','minced'],[1,'tbsp','Butter'],[2,'piece','Tomatoes','diced'],[1,'piece','Cucumber','diced'],[0.5,'piece','Red onion','diced'],[2,'tbsp','Vinegar'],[4,'piece','Calamansi']],
steps:['Cook rice. Fry garlic in butter until golden, then stir it through the rice.','Season fish with salt and pepper and dust with flour.','Pan-fry in oil 3 minutes per side until it flakes.','Toss tomato, cucumber and onion with vinegar and a pinch of salt.','Serve fish with garlic rice, salad and calamansi.']},
{id:'b-cauliricestirfry',name:'Chicken stir-fry with cauliflower rice',time:30,serv:4,tags:['quick'],ing:[
[800,'g','Chicken breast, boneless skinless','bite-size'],[1,'piece','Cauliflower','grated or riced'],[3,'cup','Broccoli','florets'],[1,'piece','Red bell pepper','sliced'],[1,'cup','Snow peas'],[3,'tbsp','Soy sauce'],[1,'tbsp','Oyster sauce'],[3,'clove','Garlic','minced'],[1,'piece','Ginger, fresh','grated'],[2,'tbsp','Vegetable oil'],[1,'tsp','Sesame oil'],[2,'stalk','Green onions','sliced']],
steps:['Stir-fry chicken in 1 tbsp oil until cooked; set aside.','Stir-fry broccoli, pepper and snow peas with garlic and ginger 3-4 minutes.','Return chicken with soy and oyster sauce; toss.','In another pan, cook riced cauliflower in the remaining oil 5 minutes; season with salt.','Serve stir-fry over cauliflower rice with sesame oil and green onions.']},
{id:'b-salmonasparagus',name:'Lemon garlic salmon with asparagus',time:25,serv:4,tags:['quick','one-pan'],ing:[
[800,'g','Salmon fillet'],[1,'bunch','Asparagus','trimmed'],[2,'cup','Cherry tomatoes'],[2,'tbsp','Olive oil'],[2,'tbsp','Butter','melted'],[3,'clove','Garlic','minced'],[1,'piece','Lemons'],[0.5,'tsp','Salt'],[0.25,'cup','Parsley','chopped']],
steps:['Heat oven to 200°C / 400°F.','Toss asparagus and tomatoes with oil and salt on a sheet pan; push to the sides.','Place salmon in the middle. Mix butter, garlic and lemon juice and spoon over the fish.','Roast 12-15 minutes until the salmon flakes. Top with parsley and lemon slices.']},
{id:'b-tacosalad',name:'Tex-Mex taco salad',time:20,serv:4,tags:['tex-mex','quick'],ing:[
[700,'g','Ground beef 90/10'],[2,'tbsp','Taco seasoning'],[6,'cup','Romaine lettuce','chopped'],[2,'piece','Tomatoes','diced'],[1,'piece','Avocado','diced'],[1,'cup','Cheddar cheese','shredded'],[0.5,'cup','Black beans, cooked or canned','rinsed'],[0.5,'cup','Salsa, jarred'],[0.5,'cup','Greek yogurt, plain nonfat','as sour cream'],[0.25,'cup','Cilantro']],
steps:['Brown beef, add taco seasoning and 1/3 cup water; simmer 5 minutes.','Pile lettuce into bowls and top with beef, tomatoes, beans, avocado and cheese.','Dollop with yogurt and salsa, and finish with cilantro.']},
{id:'b-shoyuramen',name:'Shoyu ramen with chashu-style pork',time:150,serv:4,tags:['japanese','make-ahead'],ing:[
[700,'g','Pork shoulder (kasim)','rolled and tied'],[0.5,'cup','Soy sauce'],[0.25,'cup','Mirin'],[0.25,'cup','Sake (cooking rice wine)'],[2,'tbsp','White sugar'],[4,'clove','Garlic','smashed'],[1,'piece','Ginger, fresh','sliced'],[1,'cup','Water'],[8,'cup','Chicken broth'],[1,'tsp','Dashi granules (hondashi)'],[520,'g','Fresh ramen noodles'],[4,'piece','Eggs','soft-boiled'],[0.5,'cup','Menma (seasoned bamboo shoots)'],[4,'stalk','Green onions','sliced'],[4,'piece','Nori sheets','cut in half']],
steps:['Brown the pork on all sides in a heavy pot.','Add soy sauce, mirin, sake, sugar, garlic, ginger and the water. Cover and simmer on low for 2 hours, turning every 30 minutes.','Meanwhile soft-boil the eggs for 6½ minutes, cool in ice water and peel. Soak them in a few spoonfuls of the braising liquid.','Heat the broth with the dashi granules and about 1/3 cup of the braising liquid. Taste and add more for a deeper soy flavor.','Cook the noodles as the package says and drain well.','Slice the pork thinly. Divide noodles into bowls, ladle hot broth over, and top with pork, halved eggs, menma, green onions and nori.']},
{id:'b-misoramen',name:'Miso ramen with pork and corn',time:30,serv:4,tags:['japanese','quick','kid-favorite'],ing:[
[450,'g','Ground pork'],[0.33,'cup','Miso paste'],[2,'tbsp','Soy sauce'],[1,'tbsp','Sesame oil'],[4,'clove','Garlic','minced'],[1,'tbsp','Ginger, fresh','grated'],[8,'cup','Chicken broth'],[520,'g','Fresh ramen noodles'],[2,'cup','Bean sprouts (togue)'],[1,'cup','Sweet corn kernels'],[2,'tbsp','Butter'],[4,'piece','Eggs','soft-boiled'],[4,'stalk','Green onions','sliced']],
steps:['Soft-boil the eggs for 6½ minutes, cool in cold water and peel.','Brown the pork in sesame oil with the garlic and ginger, breaking it up, about 6 minutes. Stir in the soy sauce.','Add the broth and bring to a simmer. Turn off the heat and whisk in the miso. Do not boil it after this.','Cook the noodles as the package says. Blanch the bean sprouts in the same water for 30 seconds.','Divide noodles into bowls, ladle broth and pork over, and top with sprouts, corn, a pat of butter, halved eggs and green onions.']},
{id:'b-tonkotsu',name:'Tonkotsu-style ramen (shortcut pork broth)',time:50,serv:4,tags:['japanese'],ing:[
[300,'g','Pork belly (liempo)','thinly sliced'],[6,'cup','Pork bone broth'],[1,'cup','Milk, whole'],[3,'tbsp','Soy sauce'],[1,'tbsp','Mirin'],[6,'clove','Garlic','grated'],[1,'tbsp','Ginger, fresh','grated'],[1,'tbsp','Sesame oil'],[520,'g','Fresh ramen noodles'],[4,'piece','Eggs','soft-boiled'],[0.5,'cup','Menma (seasoned bamboo shoots)'],[4,'stalk','Green onions','sliced'],[4,'piece','Nori sheets'],[1,'tbsp','Sesame seeds','toasted']],
steps:['Soft-boil the eggs for 6½ minutes, cool and peel.','Sear the pork belly slices in a hot pan until golden on both sides. Set aside.','In a pot, cook the garlic and ginger in sesame oil for 1 minute. Add the pork broth and simmer 10 minutes.','Stir in the milk, soy sauce and mirin and heat until steaming, without boiling. The milk gives the creamy, cloudy look of tonkotsu.','Cook the noodles as the package says and drain.','Divide noodles into bowls, ladle broth over, and top with pork belly, halved eggs, menma, green onions, nori and sesame seeds.']},
{id:'b-tantanmen',name:'Spicy miso tantanmen',time:35,serv:4,tags:['japanese'],ing:[
[500,'g','Ground pork'],[1,'tbsp','Sesame oil'],[4,'clove','Garlic','minced'],[1,'tbsp','Ginger, fresh','minced'],[2,'tbsp','Chili bean paste (doubanjiang)','use less for milder'],[2,'tbsp','Soy sauce'],[0.25,'cup','Tahini (sesame paste)'],[2,'tbsp','Miso paste'],[7,'cup','Chicken broth'],[1,'cup','Milk, whole'],[520,'g','Fresh ramen noodles'],[400,'g','Bok choy (pechay)','halved'],[4,'stalk','Green onions','sliced'],[1,'tbsp','Sesame seeds'],[1,'tbsp','Chili oil','to serve']],
steps:['Fry the pork in sesame oil with the garlic and ginger until browned. Stir in the chili bean paste and 1 tablespoon soy sauce and cook 2 minutes. Set aside.','In a bowl, whisk the tahini, miso and remaining soy sauce until smooth.','Heat the broth and milk until steaming. Whisk a ladle of hot broth into the tahini mix, then stir it all back into the pot. Do not boil.','Cook the noodles as the package says, adding the bok choy for the last 2 minutes.','Divide noodles and bok choy into bowls, pour the broth over, and top with the spicy pork, green onions, sesame seeds and a drizzle of chili oil. For milder bowls, serve the chili oil on the side.']},
{id:'b-shioramen',name:'Chicken shio ramen',time:40,serv:4,tags:['japanese'],ing:[
[700,'g','Chicken thigh, boneless skinless'],[1,'tbsp','Sesame oil'],[8,'cup','Chicken broth'],[2,'tbsp','Sake (cooking rice wine)'],[1,'tbsp','Mirin'],[1,'tsp','Dashi granules (hondashi)'],[1,'tsp','Salt','adjust to taste'],[4,'clove','Garlic','sliced'],[1,'piece','Ginger, fresh','sliced'],[520,'g','Fresh ramen noodles'],[4,'piece','Eggs','soft-boiled'],[3,'cup','Spinach'],[100,'g','Fish cake (kamaboko)','sliced'],[4,'stalk','Green onions','sliced'],[1,'piece','Lemons','cut in wedges']],
steps:['Soft-boil the eggs for 6½ minutes, cool and peel.','Season the chicken with a pinch of salt and sear in sesame oil until browned and cooked through, 5 to 6 minutes per side. Rest, then slice.','Simmer the broth with garlic, ginger, sake, mirin and dashi for 10 minutes. Add salt to taste. Shio broth should be clear and lightly salty.','Cook the noodles as the package says. Wilt the spinach in the hot broth for 30 seconds.','Divide noodles into bowls, ladle broth over, and top with chicken, spinach, fish cake, halved eggs and green onions. Serve with lemon wedges.']},
{id:'b-quickramen',name:'Quick weeknight chicken ramen',time:20,serv:4,tags:['japanese','quick','budget','kid-favorite'],ing:[
[4,'piece','Instant ramen noodles (block, no seasoning)','skip the flavor packets'],[1,'tbsp','Sesame oil'],[3,'clove','Garlic','minced'],[1,'tbsp','Ginger, fresh','grated'],[7,'cup','Chicken broth'],[3,'tbsp','Soy sauce'],[1,'tbsp','Miso paste'],[3,'cup','Stir-fry vegetables, frozen'],[400,'g','Rotisserie chicken meat','shredded'],[4,'piece','Eggs'],[4,'stalk','Green onions','sliced'],[1,'tbsp','Sriracha','optional']],
steps:['Warm the sesame oil in a large pot and cook the garlic and ginger for 1 minute.','Add the broth, soy sauce and miso and bring to a boil.','Add the frozen vegetables and noodles (without the flavor packets) and cook 3 minutes.','Stir in the chicken. Crack the eggs into the simmering broth and cook 3 minutes until just set.','Ladle into bowls and top with green onions and sriracha.']},
{id:'b-tinga',name:'Chicken tinga tostadas',time:40,serv:4,tags:['mexican','kid-favorite'],ing:[
[800,'g','Chicken breast, boneless skinless'],[1,'tbsp','Vegetable oil'],[1,'piece','Onion','thinly sliced'],[3,'clove','Garlic','minced'],[3,'piece','Tomatoes','chopped'],[2,'piece','Chipotle peppers in adobo','plus 1 tbsp sauce; use less for milder'],[0.5,'cup','Chicken broth'],[1,'tsp','Dried oregano'],[12,'piece','Tostada shells, corn'],[1,'can','Refried beans, canned'],[3,'cup','Romaine lettuce','shredded'],[0.5,'cup','Sour cream'],[0.75,'cup','Queso fresco / kesong puti','crumbled'],[1,'piece','Avocado','sliced']],
steps:['Simmer the chicken in salted water for 15 to 18 minutes until cooked through. Shred with two forks.','Cook the onion in oil until soft, about 5 minutes. Add the garlic for 1 minute.','Blend the tomatoes, chipotles with sauce, broth and oregano until smooth. Pour into the pan and simmer 5 minutes.','Stir in the chicken and simmer 5 more minutes until saucy.','Warm the beans. Spread beans on each tostada, then top with chicken tinga, lettuce, sour cream, queso fresco and avocado.']},
{id:'b-pozole',name:'Pozole rojo (pork and hominy stew)',time:120,serv:4,tags:['mexican','stew','make-ahead'],ing:[
[900,'g','Pork shoulder (kasim)','cut in 5 cm chunks'],[8,'cup','Chicken broth'],[1,'piece','Onion','halved'],[6,'clove','Garlic'],[1.5,'tsp','Salt'],[5,'piece','Guajillo chiles, dried','stems and seeds removed'],[2,'piece','Ancho chiles, dried','stems and seeds removed'],[2,'tsp','Dried oregano'],[1,'tsp','Ground cumin'],[2,'can','Hominy, canned','drained and rinsed'],[2,'cup','Cabbage','finely shredded'],[6,'piece','Red radishes','thinly sliced'],[2,'piece','Limes','cut in wedges'],[8,'piece','Tostada shells, corn','to serve']],
steps:['Put the pork, half the onion, 4 garlic cloves, the salt and the broth in a large pot. Bring to a boil, skim, then simmer 1½ hours until tender.','Meanwhile toast the dried chiles in a dry pan for 30 seconds per side, then soak in 2 cups hot water for 20 minutes.','Blend the chiles with 1 cup of the soaking water, the rest of the onion and garlic, the oregano and the cumin until smooth.','Strain the chile sauce into the pot, add the hominy and simmer 20 minutes. Taste for salt.','Slow cooker option: cook the pork, broth, onion, garlic and chile sauce on Low 8h or High 4h, then add the hominy for the last 30 minutes.','Serve in bowls topped with cabbage, radishes and a squeeze of lime, with tostadas on the side.']},
{id:'b-enchiladasverdes',name:'Chicken enchiladas verdes',time:50,serv:4,tags:['mexican'],ing:[
[700,'g','Tomatillos','husked and rinsed'],[2,'piece','Jalapeño','stems removed'],[1,'piece','Onion','half in chunks, half diced'],[3,'clove','Garlic'],[0.5,'cup','Cilantro'],[0.5,'cup','Chicken broth'],[600,'g','Rotisserie chicken meat','shredded'],[1,'tbsp','Vegetable oil'],[12,'piece','Corn tortillas'],[1.5,'cup','Monterey Jack cheese','shredded'],[0.5,'cup','Sour cream'],[1,'can','Pinto beans, cooked or canned','to serve']],
steps:['Heat the oven to 200°C / 400°F.','Boil the tomatillos, jalapeños, onion chunks and garlic in water for 10 minutes, until the tomatillos turn olive green.','Drain and blend with the cilantro, broth and a big pinch of salt to make the salsa verde.','Mix the chicken with the diced onion and 1 cup of the salsa. Brush the tortillas with oil and warm them so they bend, then fill, roll and set seam-side down in a baking dish.','Pour the rest of the salsa over, top with cheese and bake 15 to 20 minutes until bubbly.','Drizzle with sour cream and serve with warm pinto beans.']},
{id:'b-mole',name:'Chicken mole with rice',time:50,serv:4,tags:['mexican'],ing:[
[900,'g','Chicken thigh, boneless skinless'],[1,'tbsp','Vegetable oil'],[0.5,'cup','Mole paste, jarred'],[3,'cup','Chicken broth'],[1,'tbsp','Brown sugar','optional'],[0.5,'piece','Onion','diced'],[2,'clove','Garlic','minced'],[1.5,'cup','White rice, uncooked'],[2.5,'cup','Water'],[1,'tbsp','Sesame seeds','toasted'],[8,'piece','Corn tortillas','warmed']],
steps:['Season the chicken with salt and brown it in oil, about 4 minutes per side. Set aside.','In the same pan, stir the mole paste with a splash of broth over low heat until it loosens, then whisk in 2½ cups broth until smooth.','Return the chicken to the sauce, cover and simmer 20 minutes until tender. Add the brown sugar if the sauce tastes bitter.','Meanwhile cook the onion and garlic in a saucepan for 2 minutes, add the rice, the last ½ cup broth and the water, and cook covered for 18 minutes.','Serve the chicken and sauce over rice, sprinkled with sesame seeds, with warm tortillas.']},
{id:'b-chilesrellenos',name:'Baked chiles rellenos with beef and cheese',time:55,serv:4,tags:['mexican'],ing:[
[8,'piece','Poblano pepper'],[450,'g','Ground beef 90/10'],[1,'piece','Onion','diced'],[3,'clove','Garlic','minced'],[1,'tsp','Ground cumin'],[1,'tsp','Dried oregano'],[1.5,'cup','Monterey Jack cheese','shredded'],[1,'can','Tomato sauce'],[1,'piece','Chipotle peppers in adobo','minced, optional'],[1,'cup','White rice, uncooked','to serve'],[1,'can','Black beans, cooked or canned','to serve']],
steps:['Char the poblanos under the broiler or over a gas flame, turning, until blistered all over. Steam in a covered bowl for 10 minutes, then peel. Slit each one and remove the seeds.','Heat the oven to 200°C / 400°F and start the rice.','Brown the beef with the onion, garlic, cumin and oregano. Stir in 1 cup of the cheese.','Fill each pepper with the beef mixture and lay them in a baking dish.','Stir the chipotle into the tomato sauce, pour it around the peppers and top with the rest of the cheese.','Bake 15 to 20 minutes until bubbly. Serve with the rice and warm black beans.']},
{id:'b-albondigas',name:'Sopa de albóndigas (Mexican meatball soup)',time:60,serv:4,tags:['mexican','budget'],ing:[
[700,'g','Ground beef 90/10'],[0.33,'cup','White rice, uncooked'],[1,'piece','Eggs'],[1,'piece','Onion','finely diced'],[3,'clove','Garlic','minced'],[1,'tsp','Ground cumin'],[1,'tsp','Dried oregano'],[1,'tsp','Salt'],[8,'cup','Chicken broth'],[1,'cup','Tomato sauce'],[2,'piece','Potatoes','diced'],[3,'piece','Carrots','sliced'],[2,'piece','Zucchini','chopped'],[0.5,'cup','Cilantro','chopped'],[2,'piece','Limes','cut in wedges'],[8,'piece','Corn tortillas','warmed']],
steps:['Mix the beef, uncooked rice, egg, half the onion, half the garlic, the cumin, oregano and salt. Roll into about 24 walnut-size meatballs.','In a large pot, soften the rest of the onion and garlic, then add the broth and tomato sauce and bring to a boil.','Drop in the meatballs, potatoes and carrots. Cover and simmer 25 minutes.','Add the zucchini and simmer 10 minutes more, until the meatballs are cooked and the rice inside is tender.','Stir in the cilantro. Serve with lime wedges and warm tortillas.']},
{id:'b-beefstew',name:'Classic beef stew',time:255,serv:4,tags:['stew','slow-cooker','make-ahead'],ing:[
[900,'g','Beef stew meat'],[3,'tbsp','All-purpose flour'],[1,'tsp','Salt'],[0.5,'tsp','Black pepper'],[2,'tbsp','Vegetable oil'],[1,'piece','Onion','chopped'],[3,'clove','Garlic','minced'],[4,'piece','Potatoes','2 cm cubes'],[4,'piece','Carrots','thick slices'],[2,'stalk','Celery','sliced'],[2,'tbsp','Tomato paste'],[1,'tbsp','Worcestershire sauce'],[4,'cup','Beef broth'],[1,'tsp','Dried thyme'],[2,'piece','Bay leaves'],[1,'cup','Peas, frozen']],
steps:['Toss the beef with the flour, salt and pepper. Brown it in oil in batches; this adds a lot of flavor.','Slow cooker: put the beef, onion, garlic, potatoes, carrots and celery in the cooker. Whisk the tomato paste and Worcestershire into the broth and pour it over. Add the thyme and bay leaves.','Cook on Low 8h or High 4h, until the beef is fork-tender.','Stovetop instead: simmer covered in a heavy pot for about 2 hours, adding the vegetables after the first hour.','Stir in the peas for the last 10 minutes. Remove the bay leaves and taste for salt.']},
{id:'b-potroast',name:'Slow cooker pot roast with vegetables',time:315,serv:4,tags:['slow-cooker','kid-favorite','make-ahead'],ing:[
[1200,'g','Beef chuck roast'],[1,'tsp','Salt'],[0.5,'tsp','Black pepper'],[1,'tbsp','Vegetable oil'],[700,'g','Red potatoes','halved'],[5,'piece','Carrots','big chunks'],[1,'piece','Onion','cut in wedges'],[4,'clove','Garlic'],[1.5,'cup','Beef broth'],[2,'tbsp','Worcestershire sauce'],[1,'tbsp','Tomato paste'],[1,'tsp','Dried thyme'],[2,'tbsp','Cornstarch','for the gravy']],
steps:['Season the roast with salt and pepper and sear it in oil on all sides until browned, about 8 minutes.','Put the potatoes, carrots, onion and garlic in the slow cooker and set the roast on top.','Whisk the broth, Worcestershire, tomato paste and thyme and pour it over.','Cook on Low 8 to 9h or High 5h, until the beef pulls apart easily.','Move the meat and vegetables to a platter. Whisk the cornstarch with 3 tablespoons cold water, stir it into the cooking liquid and cook on High for 10 minutes to thicken into gravy.']},
{id:'b-whitechili',name:'Slow cooker white chicken chili',time:255,serv:4,tags:['slow-cooker','stew','make-ahead'],ing:[
[900,'g','Chicken breast, boneless skinless'],[2,'can','Cannellini / white beans, cooked or canned','drained'],[1,'can','Green chiles, canned'],[1,'piece','Onion','diced'],[3,'clove','Garlic','minced'],[1,'piece','Jalapeño','diced'],[1.5,'tsp','Ground cumin'],[1,'tsp','Dried oregano'],[4,'cup','Chicken broth'],[1,'cup','Corn, frozen'],[120,'g','Cream cheese','cubed'],[1,'piece','Limes','juiced'],[0.5,'cup','Cilantro','chopped'],[1,'cup','Monterey Jack cheese','shredded, to serve'],[2,'cup','Tortilla chips','to serve']],

const QRE=/^((?:\d+\s+\d+\/\d+)|(?:\d+\/\d+)|(?:\d*\.?\d+\s*[½¼¾⅓⅔⅛]?)|[½¼¾⅓⅔⅛])(?:\s*(?:-|to)\s*\d*\.?\d+)?/;
function numOf(s){let t=0;String(s).trim().split(/\s+/).forEach(p=>{if(UF[p])t+=UF[p];else if(/^\d+\/\d+$/.test(p)){const a=p.split('/');t+=a[0]/a[1]}else{const l=p.slice(-1);if(UF[l]&&p.length>1)t+=parseFloat(p)+UF[l];else t+=parseFloat(p)||0}});return Math.round(t*1000)/1000}

 const um=rest.match(/^([A-Za-z]+)\.?(?:\s+|$)(?:of\s+)?/);
 if(um){const w=um[1],uu=UNIT_ALIAS[w]||UNIT_ALIAS[w.toLowerCase()];if(uu&&rest.length>um[0].length){u=uu;rest=rest.slice(um[0].length).trim()}}
 let note='';const notes=[];rest=rest.replace(/\(([^)]*)\)/g,(a,b)=>{notes.push(b.trim());return ' '}).trim();
 if(/\bto taste\b/i.test(rest)){u='to taste';rest=rest.replace(/,?\s*to taste\b/i,'').trim()}
 const ci=rest.indexOf(',');let nm=rest;if(ci>0){notes.unshift(rest.slice(ci+1).trim());nm=rest.slice(0,ci).trim()}
 note=notes.filter(Boolean).join('; ');
 if(q==null&&!u){u=/^(salt|pepper|black pepper|salt and pepper)$/i.test(nm)?'to taste':'piece';q=u==='to taste'?'':1}

 const bm=findIng(nm)||bestMatch(rest);
 return {q:q==null?'':q,u,n:bm?bm.name:nm.replace(/^\w/,c=>c.toUpperCase()),note:bm&&bm.name.toLowerCase()!==nm.toLowerCase()&&!note?nm:note}}

function vitalsPrompt(x){const GL={hp:'high protein',lc:'low carb',quick:'ready in under 30 minutes',budget:'budget-friendly',jp:'Japanese style, like ramen or curry',tex:'Mexican or Tex-Mex style',slow:'a stew or slow cooker meal',kid:'something teenagers will love'};const gl=goals.filter(g=>GL[g]).map(g=>GL[g]);
 return `Give me a dinner recipe for 4 people (two adults and two teenage boys with big appetites)${x?' using '+x:''}${gl.length?'. Goals: '+gl.join(', '):''}. Include prep and cook time, step-by-step instructions, and estimated macros per serving (calories, protein, carbs, fat, fiber). List the ingredients one per line with amounts first, like "500 g chicken breast" or "2 tbsp soy sauce", so I can paste them into my meal planner. We live in Manila, so use ingredients I can find there.`}
function autofill(){const days=weekDays(curWeek).filter(d=>!plan[d]);if(!days.length){toast('No empty nights this week');return 0}
 const inWeek=new Set(weekDays(curWeek).map(d=>plan[d]).filter(e=>e&&e.kind==='meal').map(e=>e.meal));
 let pool=rankMeals(goals).filter(x=>!inWeek.has(x.m.id));if(!pool.length)pool=rankMeals([]).filter(x=>!inWeek.has(x.m.id));
 const fresh=pool.filter(x=>!recentlyUsed(x.m.id)),use=(fresh.length>=days.length?fresh:pool).slice();
 let n=0;days.forEach(d=>{if(!use.length)return;const top=Math.min(use.length,Math.max(4,days.length+2));const k=Math.floor(Math.random()*top);const x=use.splice(k,1)[0];setNight(d,x.m.id);n++});
 return n}

function combineQty(g){const parts=g.parts.filter(p=>p.u!=='to taste'&&p.q>0);if(!parts.length)return g.parts.length?'to taste':'';
 const byU={};parts.forEach(p=>{byU[p.u]=(byU[p.u]||0)+p.q});const us=Object.keys(byU);
 if(us.length===1)return fmtQty(byU[us[0]],us[0],true);
 if(us.every(u=>VOL[u])){let ml=0;us.forEach(u=>ml+=byU[u]*VOL[u]);return ml>=60?fmtQty(ml/240,'cup',true):fmtQty(ml/15,'tbsp',true)}
 if(us.every(u=>MASS[u])){let s=0;us.forEach(u=>s+=byU[u]*MASS[u]);return fmtG(s)}
 if(g.ing&&us.every(u=>MASS[u]||!toGrams(g.ing,1,u).approx)){let s=0;us.forEach(u=>s+=toGrams(g.ing,byU[u],u).g);return 'about '+fmtG(s)}
 return us.map(u=>fmtQty(byU[u],u,true)).join(' + ')}
function wkState(ws){if(!shop.state)shop.state={};const st=shop.state[ws]=shop.state[ws]||{done:[],removed:[]};if(!Array.isArray(st.done))st.done=[];if(!Array.isArray(st.removed))st.removed=[];return st}
function genShop(ws){const agg=new Map();
 weekDays(ws).forEach(d=>{const e=plan[d];if(!e||e.kind!=='meal')return;const m=mealById(e.meal);if(!m)return;const sc=(+e.serv||m.serv)/m.serv;
  m.ing.forEach(x=>{if(!x.n||/^water$/i.test(String(x.n).trim()))return;const ing=findIng(x.n);const key=(ing?ing.name:String(x.n).trim()).toLowerCase();
   let g=agg.get(key);if(!g){g={name:ing?ing.name:String(x.n).trim(),ing,parts:[],from:new Set()};agg.set(key,g)}
   g.parts.push({q:(+x.q||0)*sc,u:x.u});g.from.add(m.name)})});
 const st=wkState(ws),keepDone=new Set(st.done),rem=new Set(st.removed);
 const gen=[];agg.forEach((g,key)=>{if(!rem.has(key))gen.push({id:uid(),key,name:g.name,qty:combineQty(g),sec:g.ing?g.ing.sec:'ot',done:keepDone.has(key),manual:false,from:[...g.from]})});
 const keepW=new Set([ws].concat(Object.keys(shop.state).sort().slice(-12)));Object.keys(shop.state).forEach(k=>{if(!keepW.has(k))delete shop.state[k]});
 shop.week=ws;shop.made=new Date().toISOString();shop.items=shop.items.filter(i=>i.manual).concat(gen);saveShop();return {n:gen.length,removed:rem.size,meals:weekDays(ws).filter(d=>plan[d]&&plan[d].kind==='meal'&&mealById(plan[d].meal)).length}}

 case 'vitals':copyText(vitalsPrompt(($('#vx').value||'').trim()),'Copied. Paste it into your Vitals chat.');break;
 case 'genshop':go('shop');break;
 case 'acadd':$('#addname').value=b.dataset.n;$('#addac').innerHTML='';if(!$('#addsec').value){const ing=findIng(b.dataset.n);if(ing)$('#addsec').value=ing.sec}$('#addqty').focus();break;
 case 'additem':addManual();break;
 case 'tick':{const it=shop.items.find(i=>i.id===v);if(!it)return;it.done=!it.done;if(!it.manual){const st=wkState(shop.week),s=new Set(st.done);it.done?s.add(it.key):s.delete(it.key);st.done=[...s]}saveShop();const y=window.scrollY;renderShop();window.scrollTo(0,y);break}
 case 'delitem':{const it=shop.items.find(i=>i.id===v);if(it&&!it.manual)wkState(shop.week).removed.push(it.key)}shop.items=shop.items.filter(i=>i.id!==v);saveShop();{const y=window.scrollY;renderShop();window.scrollTo(0,y)}break;
 case 'clearchecked':shop.items.forEach(i=>{if(i.done&&!i.manual)wkState(shop.week).removed.push(i.key)});shop.items=shop.items.filter(i=>!i.done);saveShop();renderShop();toast('Checked items cleared');break;
 case 'clearlist':if(confirm('Remove every item from this week\'s list, including ones you added?')){shop.items.forEach(i=>{if(!i.manual)wkState(shop.week).removed.push(i.key)});shop.items=[];saveShop();renderShop()}break;
 case 'restoreshop':wkState(curWeek).removed=[];saveShop();renderShop();toast('Removed items are back');break;
 case 'copylist':copyText(listText(),'List copied');break;
 case 'export':{const blob=new Blob([exportData()],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='family-dinners-'+iso(new Date())+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);break}
 case 'copyjson':{const t=exportData();(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied')).catch(()=>{const ta=$('#imptext');ta.value=t;ta.select();toast('Select all and copy from the box')});break}
 case 'importtext':doImport($('#imptext').value);break;
 case 'reset':if(confirm('Erase your meals, plans, shopping list and settings on this phone?')&&confirm('This cannot be undone. Erase?')){Object.values(K).forEach(k=>localStorage.removeItem(k));settings=Object.assign({},DEFAULT_SETTINGS);myMeals=[];plan={};shop=cleanShop(null);customIng=[];goals=[];mealDraft=null;rebuildIng();macroCache.clear();curWeek=lastActive=activeWeek();toast('Erased');go('plan')}break;
 }
});
document.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('day')){ev.preventDefault();go('day',ev.target.dataset.v)}});
function onEditInput(el){if(view.name!=='edit'||!mealDraft||!el.dataset.ef)return;const f=el.dataset.ef,row=el.closest('.ingrow');
 if(row){const i=+row.dataset.i,x=mealDraft.ing[i];if(!x)return;x[f]=el.value;
  if(f==='n'){const ac=row.querySelector('.ac');const r=findIng(el.value)?[]:searchIng(el.value,6);ac.innerHTML=r.map(g=>`<button data-a="acpick" data-v="${i}" data-n="${esc(g.name)}">${esc(g.name)}</button>`).join('')}
  updRow(i)}
 else{mealDraft[f]=el.value;if(f==='serv')updEst()}
 saveDraft()}
document.addEventListener('input',ev=>onEditInput(ev.target));
document.addEventListener('change',ev=>{if(ev.target.tagName==='SELECT')onEditInput(ev.target)});

// ---------- offline ----------
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
render();if(migrateMsg)setTimeout(()=>toast(migrateMsg),300);

// If the phone kept the app open across a rollover, move to the new active week (only if he hadn't navigated away).
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;const aw=activeWeek();if(aw!==lastActive){if(curWeek===lastActive&&['plan','shop','ideas'].includes(view.name)){curWeek=aw;lastActive=aw;render()}else lastActive=aw}});

</script>
</body>
